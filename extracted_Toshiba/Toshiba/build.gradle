plugins {
    id 'fabric-loom' version '1.15.5'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'net.java.dev.jna:jna:5.15.0'
    implementation 'org.jetbrains:annotations:26.0.2'
    implementation 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.48.0'
}

loom {
    accessWidenerPath = file('src/main/resources/toshiba.accesswidener')
    runs {
        client {
            client()
            runDir 'run'
            programArgs '--username', 'User', '--accessToken', '0'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror', '-Xmaxwarns', '5000']
}

tasks.named('jar') {
    exclude 'META-INF/MANIFEST.MF'
}
