plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def releaseRequested = requestedTasks.any {
	it == 'build' || it == 'jar' || it == 'assemble' ||
			it.endsWith(':build') || it.endsWith(':jar') || it.endsWith(':assemble')
}
def devBuild = project.hasProperty('dev') ||
		(!releaseRequested && requestedTasks.any { it.contains('runclient') })

def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo/java')

tasks.register('generateBuildInfo') {
	inputs.property('dev', devBuild)
	outputs.dir(buildInfoDir)
	doLast {
		def out = buildInfoDir.get().file('tokyo/ghoul/api/system/BuildInfo.java').asFile
		out.parentFile.mkdirs()
		out.text = """package tokyo.ghoul.api.system;

/** Generated by Gradle; do not edit. */
public final class BuildInfo {
    public static final boolean DEV = ${devBuild};

    private BuildInfo() {
    }
}
"""
	}
}

sourceSets.main.java.srcDir(buildInfoDir)
tasks.named('compileJava') {
	dependsOn tasks.named('generateBuildInfo')
}
tasks.matching { it.name == 'sourcesJar' }.configureEach {
	dependsOn tasks.named('generateBuildInfo')
}

loom {
	accessWidenerPath = file("src/main/resources/desire.accesswidener")

	runs {
		client2 {
			client()
			name = "Minecraft Client 2"
			runDir = "run2"
			ideConfigGenerated = true
		}
	}

	runs.configureEach {
		vmArgs '--enable-native-access=ALL-UNNAMED',
				'--sun-misc-unsafe-memory-access=allow',
				'-Djoml.nounsafe=true',
				'-Ddesire.dev=true'
	}
}

repositories {
	mavenLocal()
	flatDir {
		dirs 'libs'
	}
	mavenCentral()
	maven {
		name = "FirstDarkDev"
		url = uri("https://maven.firstdark.dev/releases")
	}
	maven {
		name = "Jitpack"
		url = uri("https://jitpack.io")
	}
}

configurations {
	bundled {
		canBeConsumed = false
		canBeResolved = true
	}
	implementation.extendsFrom bundled
	jij {
		canBeConsumed = false
		canBeResolved = true
	}
}

configurations.all {
	resolutionStrategy {
		force "io.github.llamalad7:mixinextras-fabric:0.5.5"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "io.github.llamalad7:mixinextras-fabric:0.5.5"
	jij "io.github.llamalad7:mixinextras-fabric:0.5.5"
	annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.5.5"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

	bundled "ai.catboost:catboost-common:${project.ai_version}"
	bundled "ai.catboost:catboost-prediction:${project.ai_version}"
	bundled "ai.djl:api:${project.djl_version}"
	bundled "ai.djl.pytorch:pytorch-engine:${project.djl_version}"
	bundled "ai.djl.pytorch:pytorch-jni:${project.pytorch_native_version}-${project.djl_version}"
	bundled "ai.djl.pytorch:pytorch-native-cpu:${project.pytorch_native_version}:win-x86_64"
	bundled "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	bundled "dev.firstdark.discordrpc:discord-rpc:1.0.4"
	bundled "com.github.weisj:jsvg:2.1.0"

	bundled "org.json:json:${project.json_version}"
}

processResources {
	inputs.property "version", project.version

	exclude "assets/desire/protect/**"

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
	exclude "assets/desire/protect/**"
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from {
		configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
	}
	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}

	doLast {
		def modsDir = file('run/mods')
		def nested = (modsDir.isDirectory() ? modsDir.listFiles() : [])
				.findAll { it.name.endsWith('.jar') }.sort { it.name }
		nested = nested + configurations.jij.resolve().findAll { f -> !nested.any { it.name == f.name } }

		def out = archiveFile.get().asFile
		def tmp = new File(out.parentFile, out.name + '.tmp')
		def zin = new java.util.zip.ZipFile(out)
		def zout = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp))

		java.util.Collections.list(zin.entries()).each { entry ->
			if (entry.name == 'fabric.mod.json') {
				def fmj = new groovy.json.JsonSlurper().parse(zin.getInputStream(entry).bytes)
				fmj.jars = nested.collect { [file: "META-INF/jars/${it.name}"] }
				zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
				zout.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fmj)).getBytes('UTF-8'))
				zout.closeEntry()
			} else if (!entry.name.startsWith('META-INF/jars/')) {
				zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
				zin.getInputStream(entry).transferTo(zout)
				zout.closeEntry()
			}
		}

		nested.each { mod ->
			zout.putNextEntry(new java.util.zip.ZipEntry("META-INF/jars/${mod.name}"))
			new java.io.FileInputStream(mod).withCloseable { it.transferTo(zout) }
			zout.closeEntry()
		}

		zin.close()
		zout.close()
		out.delete()
		tmp.renameTo(out)
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
